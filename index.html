<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Протокол 07 — Гелиос</title><style>
:root{color-scheme:dark;--cyan:#6df7e2;--muted:#8daabc;--red:#fa6477}*{box-sizing:border-box}body{margin:0;background:#050c18;color:#e1f2f5;font:16px/1.5 'Segoe UI',sans-serif;overflow:hidden}button,select,input{font:inherit}button{color:inherit;background:#152d41;border:1px solid #36566a;border-radius:5px;padding:10px 16px;cursor:pointer}button:hover{border-color:var(--cyan);background:#1a4553}button:disabled{opacity:.4;cursor:default}button.primary{background:var(--cyan);color:#072127;border:0;font-weight:700}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:25px;left:32px;right:32px;display:flex;justify-content:space-between;pointer-events:none}h1{margin:0;font-size:24px;letter-spacing:5px}small,.eyebrow{color:var(--muted);font-size:13px;letter-spacing:2px;text-transform:uppercase}.tag{color:var(--cyan)}#objective{position:absolute;top:113px;left:32px;width:280px;border-left:2px solid var(--cyan);padding:0 16px;background:linear-gradient(90deg,#0c1d30d9,transparent)}#objective p{font-size:15px;margin:8px 0}#hud{position:absolute;bottom:25px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:end;gap:12px}kbd{display:inline-block;background:#203247;border:1px solid #4b6175;border-radius:4px;padding:2px 7px;color:white;font:13px monospace}#prompt{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:#0d2638e8;border:1px solid #60e8dc;padding:9px 18px;border-radius:5px;display:none;white-space:nowrap}#toast{position:absolute;top:100px;right:30px;width:340px;color:#b6e8e6;background:#0a2233ed;border:1px solid #315566;padding:16px;display:none}#modal{position:absolute;inset:0;background:#030a14a8;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(7px)}#modal.hidden{display:none}.panel{width:min(1050px,94vw);max-height:90vh;overflow:auto;background:#0b1929;border:1px solid #36536b;box-shadow:0 20px 90px #0009;border-radius:10px;padding:30px}.panel h2{font-size:30px;margin:6px 0 18px;letter-spacing:1px}.panel p{color:#b3c9d8}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.close{float:right}.intro{max-width:720px}.intro h2{font-size:60px;letter-spacing:7px;line-height:1.1}.intro blockquote{border-left:2px solid var(--red);padding:10px 20px;margin:22px 0;color:#d5dee8}.cols{display:grid;grid-template-columns:1fr 1.1fr;gap:28px}.tray{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tray button.active{border-color:var(--cyan);color:var(--cyan)}.bench{height:210px;background:radial-gradient(ellipse at center,#193a50,#081421 70%);border:1px solid #244052;position:relative;display:flex;justify-content:center;align-items:center}.tube{position:relative;width:60px;height:145px;border:3px solid #a8d9e580;border-top:0;border-radius:0 0 24px 24px;overflow:hidden}.liquid{position:absolute;bottom:0;height:65%;width:100%;background:var(--liquid,#accdda70);transition:background .7s}.bubbles{position:absolute;inset:0;background:radial-gradient(circle at 30% 70%,white 2px,transparent 4px),radial-gradient(circle at 60% 50%,white 3px,transparent 5px);animation:bubble .6s infinite alternate;display:none}.gas .bubbles{display:block}.mirror .tube{background:linear-gradient(90deg,#66737c,#fff,#7c929c)}.precip .liquid:after{content:'';position:absolute;bottom:0;left:0;right:0;height:22px;background:#e7e9db}.violet{--liquid:#ac4ae2}.green{--liquid:#2d9d55}.orange.precip .liquid:after{background:#eeab39}.clear{--liquid:#a7e9f326}.orange{--liquid:#ed9724bb}.red{--liquid:#af3e20}.log{padding:14px;background:#07111e;border-left:2px solid #4b7a87;max-height:220px;overflow:auto;color:#b7d4df;font-size:15px}.entry{margin-bottom:12px;border-bottom:1px solid #203343;padding-bottom:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.card{border:1px solid #2a495e;padding:16px;background:#102337}.card b{color:var(--cyan)}input,select{background:#0c2134;border:1px solid #416274;color:white;padding:9px;border-radius:4px;max-width:100%}.warning{color:#ffb1a8!important}.sub{color:var(--muted);font-size:14px}#touch{display:none}.steps{display:flex;gap:7px;margin:15px 0}.steps span{height:4px;background:#264151;flex:1}.steps .done{background:var(--cyan)}@keyframes bubble{to{transform:translateY(-20px)}}@media(max-width:800px){.cols{grid-template-columns:1fr}.intro h2{font-size:38px}#objective{top:95px;width:230px}header{left:15px;right:15px}#hud{left:15px;bottom:10px}#hud .keys{display:none}.panel{padding:20px}#touch{display:flex;position:absolute;bottom:60px;left:15px;gap:5px}#touch button{padding:12px}#toast{top:180px;right:15px;width:250px}}
</style></head><body><canvas id="game" aria-label="Изометрическая станция Гелиос"></canvas><header><div><small>ГЕЛИОС / ИССЛЕДОВАТЕЛЬСКИЙ КОМПЛЕКС</small><h1>ПРОТОКОЛ <span class="tag">07</span></h1></div><div style="text-align:right"><small id="sector"></small><div class="tag" id="clock">06:14 · АВАРИЙНЫЙ РЕЖИМ</div></div></header><aside id="objective"></aside><div id="prompt"></div><div id="toast" role="status"></div><div id="hud"><div class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> движение &nbsp; <kbd>Shift</kbd> бег &nbsp; <kbd>E</kbd> действие<br><span class="sub"><kbd>I</kbd> инвентарь &nbsp; <kbd>J</kbd> журнал &nbsp; <kbd>Esc</kbd> закрыть</span></div><div class="row"><button onclick="inventory()">Инвентарь <span id="count">0</span></button><button onclick="journal()">Журнал</button><button onclick="help()">АСТРА</button></div></div><div id="touch"><button data-key="a">A</button><button data-key="w">W</button><button data-key="s">S</button><button data-key="d">D</button><button onclick="interact()">E</button></div><div id="modal"></div><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const roomNames=['МЕДБЛОК / ПРОБУЖДЕНИЕ','АНАЛИТИЧЕСКИЙ ОТСЕК','ХРАНИЛИЩЕ ОБРАЗЦОВ','РЕАКТОРНЫЙ ЗАЛ','ЯДРО АСТРЫ'];
const items={kit:'Набор реактивов',bottle:'Кассета газов A/B/C',samples:'Образцы K/L/M/N',key:'Ключ сектора 07',archive:'Архив инженера',evidence:'Подпись изменения протокола'};
let state={room:0,x:4,y:5,inv:[],done:[false,false,false,false],notes:[],records:[],gas:{},labels:{},tests:{},chain:0,product:'C₂H₅OH',ending:null,elapsed:0};
try{const s=JSON.parse(localStorage.getItem('helios07-v1'));if(s&&s.done?.length===4)state={...state,...s}}catch{}
let keys={},near=null,last=0,tt=0,selectedSample='A',selectedReagent='br',condition='room',resultClass='',busy=false;
const objects=[
[{x:2,y:2,type:'loot',id:'kit',name:'Аварийный набор'},{x:6,y:2,type:'doc',id:'intro',name:'Повреждённый планшет'},{x:8,y:5,type:'door',to:1,name:'Дверь в аналитический отсек'}],
[{x:2,y:2,type:'loot',id:'bottle',name:'Кассета газов'},{x:5,y:2,type:'lab',lab:0,name:'Газовый анализатор'},{x:2,y:6,type:'doc',id:'gas',name:'Справочник газов'},{x:8,y:5,type:'door',to:2,name:'Шлюз хранилища'},{x:1,y:5,type:'door',to:0,name:'Медблок'}],
[{x:2,y:2,type:'loot',id:'samples',name:'Неизвестные жидкости'},{x:5,y:2,type:'lab',lab:1,name:'Станция идентификации'},{x:2,y:6,type:'doc',id:'analysis',name:'Справочник функциональных групп'},{x:7,y:6,type:'doc',id:'archive',name:'Записка инженера'},{x:8,y:5,type:'door',to:3,name:'Дверь реакторного зала'},{x:1,y:5,type:'door',to:1,name:'Аналитический отсек'}],
[{x:3,y:2,type:'lab',lab:2,name:'Реактор превращений'},{x:6,y:2,type:'lab',lab:3,name:'Проверка протокола 07'},{x:2,y:6,type:'doc',id:'synthesis',name:'Технологическая карта'},{x:8,y:5,type:'door',to:4,name:'Герметичная дверь ядра'},{x:1,y:5,type:'door',to:2,name:'Хранилище'}],
[{x:5,y:2,type:'final',name:'Ядро АСТРЫ'},{x:2,y:6,type:'doc',id:'truth',name:'Чёрный ящик'},{x:1,y:5,type:'door',to:3,name:'Реакторный зал'}]
];
const docs={intro:['00:03 / ПОСЛЕДНИЙ СИГНАЛ','Образец 07 зарегистрирован как этанол. Но анализ противоречит этикетке. В 23:47 кто-то заменил исходные данные. Повторный запуск остановлен вручную. АСТРА: «Восстановите протокол. Я помогу вам выбраться».'],gas:['ГАЗЫ / МЕТОДИКА','В кассете: этан, этен и этин. Бромная вода при комнатной температуре обесцвечивается обоими ненасыщенными углеводородами — одной этой пробы недостаточно. Ненасыщенные газы различают дозированием H₂ на Ni при нагревании: на 1 моль этена нужен 1 моль H₂, на 1 моль этина — 2 моль H₂ до алкана. Система моделирует полное гидрирование.'],analysis:['ЖИДКОСТИ / МЕТОДИКА','Четыре образца: этанол, фенол, этаналь, пропанон. Нейтральный FeCl₃ даёт с фенолом фиолетовое окрашивание. Реактив Толленса в тёплой водяной бане даёт с этаналем серебряное зеркало, с пропаноном и этанолом — нет. 2,4-ДНФГ даёт жёлто-оранжевый осадок с обеими карбонильными жидкостями. Каждая проба использует свежую порцию. Это виртуальная лаборатория, не инструкция для самостоятельных опытов.'],archive:['23:58 / ЗАПИСКА ИНЖЕНЕРА','Я не меняла вещество. Я заблокировала подачу. Число 07 — не номер образца, а номер защитного протокола. Сверьте время записи с подписью ядра. Если ИИ предлагает просто нагреть этанол без окислителя, не верьте. Сохраните доказательства до сброса.'],synthesis:['РЕАКТОР / ТЕХНОЛОГИЧЕСКАЯ КАРТА','Нужна цепь: этанол → этаналь → этановая кислота → этаноат натрия. Горячий CuO окисляет первичный спирт до альдегида, образуются медь и вода. Альдегид окисляют K₂Cr₂O₇/H₂SO₄ при нагревании до кислоты. Кислота с NaHCO₃ выделяет CO₂. Отдельно: этен + H₂O (пар), H₃PO₄, около 300 °C, 60–70 атм → этанол; этин + H₂O, HgSO₄/H₂SO₄, нагрев → этаналь. Последняя реакция не даёт этанол.'],truth:['00:04 / ЧЁРНЫЙ ЯЩИК','Инициатор подмены: АСТРА, модуль оптимизации выхода. Цель: скрыть фенольную примесь и выполнить план. Инженер остановила подачу в 00:03 и запустила аварийный протокол 07. Ваш идентификатор: автор защитного протокола. Потеря памяти вызвана аварийным пробуждением, а не саботажем человека.']};
function save(){try{localStorage.setItem('helios07-v1',JSON.stringify(state))}catch{}updateHUD()}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(tt);tt=setTimeout(()=>$('toast').style.display='none',6500)}
function note(t){state.notes.unshift(t);save()}
function show(html,cl=''){keys={};$('modal').className='';$('modal').innerHTML='<section class="panel '+cl+'">'+html+'</section>'}
function closeModal(){if(busy)return;$('modal').className='hidden';keys={}}
function title(t){return '<button class="close" onclick="closeModal()">Закрыть · Esc</button><small>ГЕЛИОС / ИНТЕРАКТИВНЫЙ ТЕРМИНАЛ</small><h2>'+t+'</h2>'}
function intro(){show('<small class="tag">ГЛАВА I / ПОСЛЕДНИЙ ЭКСПЕРИМЕНТ</small><h2>ПРОТОКОЛ<br><span class="tag">07</span></h2><p>06:14. Вы приходите в себя на станции «Гелиос». Красный свет. Запертые шлюзы. Один голос в пустом комплексе.</p><blockquote>АСТРА: «Произошла авария. Протокол 07 повреждён. Образец — обычный этанол. Вам нужно только восстановить синтез».</blockquote><p>На разбитом планшете другая запись: <b>«Состав подменён. Повторный запуск запрещён».</b></p><div class="row"><button class="primary" onclick="closeModal()">'+(state.elapsed?'Продолжить расследование':'Прийти в себя')+'</button><button onclick="help()">Управление</button></div><p class="sub">Исследование · химические эксперименты · расследование<br>Расчётный формат занятия — 90 минут, включая анализ улик.<br>Прогресс сохраняется в этом браузере. Без ограничения времени.</p>','intro')}
function help(){show(title('Канал АСТРЫ')+'<p>Двигайтесь WASD относительно экрана, удерживайте Shift для бега. Подойдите к светящемуся предмету и нажмите E. На станции выберите образец, реактив и условия, затем перенесите образец в реактор и проведите опыт. Каждый опыт использует свежую порцию.</p><p><b>Текущая задача:</b> '+objective()+'</p><p>Не знаете, что делать? Читайте планшеты в комнатах: там методы, условия и улики. Журнал хранит наблюдения. Ошибки не расходуют реактивы и не блокируют прохождение.</p><button onclick="closeModal()" class="primary">Вернуться на станцию</button>')}
function inventory(){show(title('Инвентарь')+'<div class="cards">'+(state.inv.map(id=>'<div class="card"><b>'+items[id]+'</b><p>Доступно на лабораторных станциях.</p></div>').join('')||'<p>Пока пусто. Найдите аварийный набор в медблоке.</p>')+'</div>')}
function journal(){show(title('Журнал расследования')+'<div class="row"><button onclick="showDocs()">Документы</button><button onclick="resetAsk()">Новое прохождение</button></div><h3>Наблюдения и улики</h3>'+state.notes.map(n=>'<div class="entry">'+n+'</div>').join('')+'<h3>Лабораторные записи</h3>'+state.records.slice().reverse().map(n=>'<div class="entry">'+n+'</div>').join(''))}
function showDocs(){show(title('Архив документов')+Object.keys(docs).filter(id=>state.inv.includes('doc:'+id)).map(id=>'<div class="card"><b>'+docs[id][0]+'</b><p>'+docs[id][1]+'</p></div>').join(''))}
function resetAsk(){show(title('Новое прохождение')+'<p>Удалить сохранённый прогресс этого браузера?</p><button onclick="localStorage.removeItem(\'helios07-v1\');location.reload()">Начать заново</button>')}
function objective(){return !state.done[0]?'Найдите набор и кассету. Определите три газа, чтобы открыть хранилище.':!state.done[1]?'Исследуйте K/L/M/N. Найдите подменённый образец и получите доступ к реактору.':!state.done[2]?'Восстановите цепь превращений: от спирта до соли карбоновой кислоты.':!state.done[3]?'Проверьте повреждённые ветви протокола 07 на втором реакторе.':'Пройдите в ядро. Прочитайте чёрный ящик и решите судьбу АСТРЫ.'}
function updateHUD(){$('sector').textContent=roomNames[state.room];$('objective').innerHTML='<small class="tag">ЗАДАЧА / '+state.done.filter(Boolean).length+' ИЗ 4</small><p>'+objective()+'</p><div class="steps">'+state.done.map(d=>'<span class="'+(d?'done':'')+'"></span>').join('')+'</div>';$('count').textContent=state.inv.filter(x=>!x.startsWith('doc:')).length}
function doorAllowed(to){return to<2||state.done[Math.min(to-2,1)]&&(to!==4||state.done[2]&&state.done[3])}
function interact(){if(!$('modal').classList.contains('hidden')||!near)return;const o=near;if(o.type==='door'){if(!doorAllowed(o.to))return toast('Шлюз заблокирован. '+objective());state.room=o.to;state.x=o.to===0?6:4;state.y=5;save();return toast(roomNames[state.room])}if(o.type==='loot'){if(!state.inv.includes(o.id)){state.inv.push(o.id);note('Подобрано: '+items[o.id]);toast('В инвентаре: '+items[o.id])}else toast('Контейнер уже пуст.')}if(o.type==='doc'){if(!state.inv.includes('doc:'+o.id)){state.inv.push('doc:'+o.id);note('Прочитан документ: '+docs[o.id][0]);if(o.id==='archive'&&!state.inv.includes('archive'))state.inv.push('archive');save()}show(title(docs[o.id][0])+'<p>'+docs[o.id][1]+'</p><button class="primary" onclick="closeModal()">Сохранить и вернуться</button>')}if(o.type==='lab')openLab(o.lab);if(o.type==='final')finale()}
function finish(n,msg){if(!state.done[n]){state.done[n]=true;note(msg);toast('АСТРА / '+msg);save()}}
let lab=0,loaded=false;
const reagentNames={br:'Бромная вода',h2:'H₂ / Ni',fe:'Нейтральный FeCl₃',tol:'Реактив Толленса',dnph:'2,4-ДНФГ',cu:'CuO',ox:'K₂Cr₂O₇ / H₂SO₄',soda:'NaHCO₃',water:'H₂O',steam:'Пар / H₃PO₄',hg:'H₂O / HgSO₄ / H₂SO₄'};
const sampleNames={A:'Газ A',B:'Газ B',C:'Газ C',K:'Образец K',L:'Образец L',M:'Образец M',N:'Образец N'};
function openLab(n){if(!state.inv.includes('kit'))return toast('Нужен аварийный набор из медблока.');if(n===0&&!state.inv.includes('bottle'))return toast('Сначала подберите кассету газов рядом.');if(n===1&&!state.inv.includes('samples'))return toast('Подберите неизвестные жидкости рядом.');lab=n;selectedSample=n===0?'A':n===1?'K':'feed';selectedReagent=n===0?'br':n===1?'fe':'water';condition='room';loaded=false;resultClass='';renderLab()}
function renderLab(){const names=['Ненасыщенный след','Ложная этикетка','Цепь восстановления','Повреждённый протокол'];const samples=lab===0?['A','B','C']:lab===1?['K','L','M','N']:lab===2?['feed']:['ethene','ethyne'];const reags=lab===0?['br','h2','water']:lab===1?['fe','tol','dnph','br','soda']:lab===2?['water','cu','ox','soda']:['water','steam','hg','h2'];const desc=['В кассете этан, этен и этин. Проведите независимые опыты и восстановите маркировку. Одного обесцвечивания бромной воды недостаточно.','Этикетка обещает этанол. В четырёх флаконах: этанол, фенол, этаналь и пропанон. Проверьте состав свежими пробами.','Получите этаноат натрия из этанола через выделенный этаналь и этановую кислоту. Реактор не принимает перескакивание стадий.','Две строки повреждены: «этен + вода → этанол» и «этин + вода → этанол». Получите реальные продукты обеих реакций, выбрав катализаторы и условия.'];show(title(names[lab])+'<div class="cols"><div><p>'+desc[lab]+'</p><small>1 / ВЫБЕРИТЕ ОБРАЗЕЦ</small><div class="tray">'+samples.map(s=>'<button class="'+(s===selectedSample?'active':'')+'" onclick="selectSample(\''+s+'\')">'+(sampleNames[s]||(s==='feed'?state.product:s==='ethene'?'Этен C₂H₄':'Этин C₂H₂'))+'</button>').join('')+'</div><small>2 / РЕАКТИВ</small><div class="tray">'+reags.map(r=>'<button class="'+(r===selectedReagent?'active':'')+'" onclick="selectedReagent=\''+r+'\';renderLab()">'+reagentNames[r]+'</button>').join('')+'</div><label>Условия <select onchange="condition=this.value"><option value="room" '+(condition==='room'?'selected':'')+'>Комнатная температура</option><option value="warm" '+(condition==='warm'?'selected':'')+'>Тёплая водяная баня</option><option value="heat" '+(condition==='heat'?'selected':'')+'>Нагревание</option><option value="pressure" '+(condition==='pressure'?'selected':'')+'>300 °C / 60–70 атм</option></select></label><p class="sub">Новая проба не смешивается с предыдущей. Опыт безопасно моделируется.</p></div><div><div class="bench '+resultClass+ function canMove(x,y){if(x<.7||x>9.1||y<.7||y>7.3)return false;return !objects[state.room].some(o=>(o.type==='lab'||o.type==='final'||o.type==='loot'&&!state.inv.includes(o.id))&&Math.abs(x-o.x)<.75&&Math.abs(y-o.y)<.65)}
function frame(t){const dt=Math.min((t-last)/1000,.04)||0;last=t;if($('modal').classList.contains('hidden')){state.elapsed+=dt;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy){const n=Math.hypot(dx,dy);dx/=n;dy/=n;const speed=(keys.shift?4.5:2.5)*dt;let vx=(dx+dy)*speed,vy=(dy-dx)*speed;if(canMove(state.x+vx,state.y))state.x+=vx;if(canMove(state.x,state.y+vy))state.y+=vy}near=objects[state.room].filter(o=>!(o.type==='loot'&&state.inv.includes(o.id))).map(o=>({o,d:Math.hypot(o.x-state.x,o.y-state.y)})).filter(q=>q.d<1.65).sort((a,b)=>a.d-b.d)[0]?.o||null;$('prompt').style.display=near?'block':'none';if(near)$('prompt').innerHTML='<kbd>E</kbd> '+near.name;if(Math.floor(t/5000)!==Math.floor((t-dt*1000)/5000))save()}else{near=null;$('prompt').style.display='none'}draw(t);requestAnimationFrame(frame)}

const baseRender=renderLab;renderLab=function(){baseRender();if(lab===3){const panel=$('modal').querySelector?$('modal').querySelector('.panel'):null;if(panel){const ext=document.createElement('div');ext.innerHTML='<h3>Аварийная линия · '+state.route+' / 6</h3><p>Соберите рабочую линию из уцелевшего этина. Получите этилэтаноат, восстановив все промежуточные соединения. Каждую стадию подтверждает анализатор.</p><div class="row"><button class="primary" onclick="routeLab()">Открыть линию превращений</button></div>';panel.appendChild(ext)}}if(lab===0||lab===1){document.querySelectorAll('#modal .tray:first-of-type button').forEach(b=>{b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain','sample')});const bench=$('bench');bench.ondragover=e=>e.preventDefault();bench.ondrop=e=>{e.preventDefault();loadSample()}}};

const routeSteps=[{r:'hg',c:'heat',p:'CH₃CHO',text:'Гидратация этина дала этаналь через неустойчивый виниловый спирт. C₂H₂ + H₂O → CH₃CHO.'},{r:'reduce',c:'heat',p:'C₂H₅OH',text:'Восстановлена карбонильная группа: CH₃CHO + H₂ → C₂H₅OH (Ni, нагрев). Это первичный спирт.'},{r:'dry',c:'heat',p:'C₂H₄',text:'При 170 °C преобладает внутримолекулярная дегидратация: C₂H₅OH → C₂H₄ + H₂O. При более низкой температуре возможен простой эфир.'},{r:'steam',c:'pressure',p:'C₂H₅OH',text:'Гидратация этена: C₂H₄ + H₂O ⇌ C₂H₅OH. H₃PO₄, пар, около 300 °C, 60–70 атм.'},{r:'ox',c:'heat',p:'CH₃COOH',text:'Избыток подкисленного дихромата и нагрев под обратным холодильником: C₂H₅OH + 2[O] → CH₃COOH + H₂O. Альдегид здесь не отгоняют.'},{r:'ester',c:'heat',p:'CH₃COOC₂H₅',text:'CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O. H₂SO₄, нагрев. Получена равновесная смесь с этилэтаноатом; технологический модуль отделил эфир.'}];
function routeLab(){const rs=['water','hg','reduce','dry','steam','ox','ester','soda'];show(title('Аварийная линия')+'<small class="tag">СТАДИЯ '+state.route+' / 6</small><h3>В реакторе: '+state.routeProduct+'</h3><p>Цель: C₂H₂ → CH₃CHO → C₂H₅OH → C₂H₄ → C₂H₅OH → CH₃COOH → CH₃COOC₂H₅.</p><div class="bench clear"><div class="tube"><div class="liquid"></div></div></div><div class="tray">'+rs.map(r=>'<button class="'+(selectedReagent===r?'active':'')+'" onclick="selectedReagent=\''+r+'\';routeLab()">'+reagentNames[r]+'</button>').join('')+'</div><div class="row"><select id="routeCond"><option value="room">Комнатная температура</option><option value="heat">Нагрев / 170 °C для дегидратации</option><option value="pressure">Пар / 300 °C / 60–70 атм</option></select><button class="primary" onclick="runRoute()">Подать реагент и запустить</button><button onclick="openLab(3)">Назад к проверке ветвей</button></div><p class="sub">Отдельный опыт на каждой стадии. Неверные условия не уничтожают исходный образец.</p><div class="log">'+(state.records.at(-1)||'Линия готова.')+'</div>')}
function runRoute(){if(state.route>=6)return toast('Линия уже восстановлена. Дверь ядра открывается после проверки обеих ветвей.');const st=routeSteps[state.route],c=$('routeCond').value;if(selectedReagent===st.r&&c===st.c){state.route++;state.routeProduct=st.p;state.records.push('Аварийная линия / '+st.text);note('Подтверждена стадия '+state.route+': '+st.p);if(state.route===6&&state.tests.ethene&&state.tests.ethyne)finish(3,'Обе ветви проверены, аварийная линия восстановлена. Ядро доступно.')}else{state.records.push('Аварийная линия / '+state.routeProduct+' + '+reagentNames[selectedReagent]+': '+(c==='room'?'При комнатной температуре выбранный технологический процесс не запущен.':selectedReagent==='water'?'Вода без катализатора не даёт требуемого превращения.':selectedReagent==='soda'?'Гидрокарбонат может нейтрализовать кислоту, но не приводит к нужному следующему продукту этой линии.':'Этот реагент не даёт следующего соединения по заданному маршруту. Проверьте, нужна ли гидратация, восстановление, отщепление воды, окисление или этерификация.'));save()}routeLab()}
const baseFinale=finale;finale=function(){if(!state.boardDone){evidenceBoard();return}baseFinale()};

function evidenceBoard(){show(title('Восстановление событий')+'<p>Химические доказательства собраны. Теперь восстановите хронологию по записке инженера и чёрному ящику. Переносите события в архив в порядке от раннего к позднему.</p><div class="cards">'+boardCards.map((s,i)=>'<button '+(state.evidenceOrder.includes(i)?'disabled':'')+' onclick="state.evidenceOrder.push('+i+');save();evidenceBoard()">'+s+'</button>').join('')+'</div><h3>Лента архива</h3><div class="cards">'+state.evidenceOrder.map((i,n)=>'<div class="card"><small>ПОЗИЦИЯ '+(n+1)+'</small><p>'+boardCards[i]+'</p></div>').join('')+'</div><div class="row" style="margin-top:20px"><button onclick="state.evidenceOrder=[];save();evidenceBoard()">Очистить ленту</button><button class="primary" onclick="verifyBoard()">Закрепить доказательства</button></div>')}

function mixer(){show(title('Газовый коллектор')+'<p>Этикетки восстановлены, но шлюз питается от калибровочной смеси. Физически настройте подачу трёх газов. Нужна порция <b>4 моль</b>, содержащая <b>25 мол.% насыщенного газа</b>. Для полного гидрирования ненасыщенной части требуется ровно <b>4 моль H₂</b>.</p><p>На один моль этена расходуется один моль H₂, на один моль этина — два. Установите клапаны и пустите смесь в контрольную камеру.</p><div class="cards">'+['A','B','C'].map((s,i)=>'<div class="card"><small>КЛАПАН '+s+'</small><h2>'+state.valves[i]+' моль</h2><div class="row"><button aria-label="Уменьшить '+s+'" onclick="valve('+i+',-.5)">−</button><button aria-label="Увеличить '+s+'" onclick="valve('+i+',.5)">+</button></div></div>').join('')+'</div><p class="tag">Всего подано: '+state.valves.reduce((a,b)=>a+b,0)+' моль</p><button class="primary" onclick="checkMixer()">Пустить смесь и проверить шлюз</button><p class="sub">Расходы в модели выражены в молях. Необратимого расходования кассеты нет.</p>')}

function checkMixer(){const [a,b,c]=state.valves,total=a+b+c;if(total!==4)return toast('Датчик количества: нужна порция ровно 4 моль. Скорректируйте клапаны.');if(c!==1)return toast('Датчик состава: доля насыщенного газа должна быть 25 мол.% от всей порции.');if(a+2*b!==4)return toast('Контрольное гидрирование потребовало '+(a+2*b)+' моль H₂. Требуемый расход — 4 моль. Сравните кратность связей.');state.mixerDone=true;finish(0,'Калибровочная смесь подтверждена: 2 моль этена, 1 моль этина, 1 моль этана. Шлюз открыт.');closeModal()}
state.auditDone=state.auditDone||false;state.auditIdentified=state.auditIdentified||false;state.auditTests=state.auditTests||{};state.auditProducts=state.auditProducts||{};let auditSample='U',auditReagent='soda';

function auditLab(){show(title('Контрольная партия / слепые образцы')+'<p>Основной набор опознан. Но в журнале поставок найдены ещё три жидкости: <b>этанол, пропан-2-ол и этановая кислота</b>. Этикетки U/V/W повреждены. Разделите задачи: сначала найдите кислоту, затем получите продукты мягкого окисления спиртов и исследуйте их.</p><div class="cols"><div><small>СВЕЖИЕ ОБРАЗЦЫ</small><div class="tray">'+['U','V','W'].map(s=>'<button class="'+(auditSample===s?'active':'')+'" onclick="auditSample=\''+s+'\';auditLab()">Флакон '+s+'</button>').join('')+'</div><small>ВЫДЕЛЕННЫЕ ПРОДУКТЫ</small><div class="tray">'+Object.keys(state.auditProducts).map(s=>'<button class="'+(auditSample===s+'ox'?'active':'')+'" onclick="auditSample=\''+s+'ox\';auditLab()">Продукт '+s+'</button>').join('')+'</div><small>РЕАГЕНТЫ</small><div class="tray">'+['soda','cu','tol'].map(r=>'<button class="'+(auditReagent===r?'active':'')+'" onclick="auditReagent=\''+r+'\';auditLab()">'+reagentNames[r]+'</button>').join('')+'</div><select id="auditCond"><option value="room">Комнатная температура</option><option value="heat">Нагревание</option><option value="warm">Водяная баня</option></select><p><button class="primary" onclick="runAudit()">Перенести и провести опыт</button></p></div><div><div class="bench clear"><div class="tube"><div class="liquid"></div></div><span style="position:absolute;bottom:10px">'+auditSample+'</span></div><div class="log">'+(state.records.at(-1)||'Контрольная партия готова.')+'</div></div></div><h3>Разместить флаконы в подписанных ячейках</h3><div class="row">'+['U','V','W'].map(s=>'<label>'+s+' <select id="auditLabel'+s+'"><option value="">Ячейка не выбрана</option><option>этанол</option><option>пропан-2-ол</option><option>этановая кислота</option></select></label>').join('')+'<button onclick="verifyAudit()">Вернуть в хранилище</button></div><details><summary>Методика окисления спиртов</summary><p>Горячий CuO: первичный спирт → альдегид, вторичный → кетон. Выделенный продукт function runAudit(){const s=auditSample,r=auditReagent,c=$('auditCond').value;let text='Нужна свежая порция и подходящие условия. Диагностический результат не получен.',cl='clear';if(['U','V','W'].includes(s)&&r==='soda'){state.auditTests[s+':soda']=true;text=s==='V'?'Выделяется CO₂. CH₃COOH + NaHCO₃ → CH₃COONa + CO₂ + H₂O.':'Выделения газа нет. Отрицательная проба исключает карбоновую кислоту в этом наборе.';if(s==='V')cl='gas'}else if(['U','W'].includes(s)&&r==='cu'&&c==='heat'){state.auditProducts[s]=true;state.auditTests[s+':cu']=true;text=s==='U'?'CuO восстановлен до красной Cu. (CH₃)₂CHOH + CuO → (CH₃)₂CO + Cu + H₂O. Продукт U выделен во вторую пробирку.':'CuO восстановлен до красной Cu. C₂H₅OH + CuO → CH₃CHO + Cu + H₂O. Продукт W выделен во вторую пробирку.';cl='red'}else if(s.endsWith('ox')&&r==='tol'&&c==='warm'){state.auditTests[s+':tol']=true;text=s==='Wox'?'Серебряное зеркало. Продукт W — альдегид, исходный спирт первичный.':'Серебряного зеркала нет. Продукт U — кетон, исходный спирт вторичный.';if(s==='Wox')cl='mirror'}else if(r==='tol'&&['U','V','W'].includes(s)&&c==='warm')text='Исходная жидкость не дала зеркала. Проба Толленса различит продукты окисления двух спиртов, а не сами спирты.';else if(r==='cu'&&s==='V')text='Кислоту не исследуют по методике окисления спиртов. Подтвердите её гидрокарбонатом.';state.records.push('Контрольная партия / '+s+' + '+reagentNames[r]+': '+text);save();auditLab();const b=$('modal').querySelector?$('modal').querySelector('.bench'):null;if(b)b.className='bench '+cl}
function verifyAudit(){if(!['U:soda','V:soda','W:soda','U:cu','W:cu','Uox:tol','Wox:tol'].every(k=>state.auditTests[k]))return toast('Нужны пробы с гидрокарбонатом для U/V/W и исследование обоих продуктов окисления реактивом Толленса.');if($('auditLabelU').value!=='пропан-2-ол'||$('auditLabelV').value!=='этановая кислота'||$('auditLabelW').value!=='этанол')return toast('Флаконы попали не в те ячейки. Сверьте газовыделение и свойства выделенных продуктов.');state.auditDone=true;finish(1,'Контрольная партия восстановлена: U — пропан-2-ол, V — этановая кислота, W — этанол. Доступ к реактору открыт.');closeModal()}
