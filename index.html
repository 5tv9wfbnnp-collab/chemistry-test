CH2-OH, спирт / NH2-CH2-COOH, аминокислота.", "Прозрачный насыщенный раствор Ca(OH)2 / взвесь Ca(OH)2 в воде.", "C3H5(ONO2)3 - сложный эфир азотной кислоты / CH3-C6H2(NO2)3 - нитросоединение.", "NaHCO3 / Na2CO3 / Na2CO3·10H2O."]}, {"id": 218, "group": "Легко перепутать", "type": "contrast", "prompt": "Фенол / бензойная кислота", "answer": "C6H5OH / C6H5COOH.", "accepted": [], "choices": ["C6H5OH / C6H5COOH.", "FeS2 / FeS.", "Прозрачный насыщенный раствор Ca(OH)2 / взвесь Ca(OH)2 в воде.", "C3H5(ONO2)3 - сложный эфир азотной кислоты / CH3-C6H2(NO2)3 - нитросоединение."]}, {"id": 219, "group": "Легко перепутать", "type": "contrast", "prompt": "Пирит / сульфид железа(II)", "answer": "FeS2 / FeS.", "accepted": [], "choices": ["FeS2 / FeS.", "C6H5OH / C6H5COOH.", "CaO / Ca(OH)2.", "Прозрачный насыщенный раствор Ca(OH)2 / взвесь Ca(OH)2 в воде."]}, {"id": 220, "group": "Легко перепутать", "type": "contrast", "prompt": "Нитроглицерин / тротил: формулы и классы", "answer": "C3H5(ONO2)3 - сложный эфир азотной кислоты / CH3-C6H2(NO2)3 - нитросоединение.", "accepted": [], "choices": ["C3H5(ONO2)3 - сложный эфир азотной кислоты / CH3-C6H2(NO2)3 - нитросоединение.", "C6H5OH / C6H5COOH.", "CaO / Ca(OH)2.", "FeS2 / FeS."]}, {"id": 221, "group": "Легко перепутать", "type": "contrast", "prompt": "Олеиновая / линолевая / линоленовая кислота: формулы и число C=C", "answer": "C17H33COOH, 1 / C17H31COOH, 2 / C17H29COOH, 3.", "accepted": [], "choices": ["C17H33COOH, 1 / C17H31COOH, 2 / C17H29COOH, 3.", "HO-CH2-CH(OH)-CH2-OH, спирт / NH2-CH2-COOH, аминокислота.", "NH4Cl / водный раствор NH3.", "C6H5OH / C6H5COOH."]}]</script>
<script>
(()=>{
 const root=document.getElementById('trivial-trainer-v1');
 const bank=JSON.parse(document.getElementById('tt-bank').textContent);
 const el={};root.querySelectorAll('[data-el]').forEach(x=>el[x.dataset.el]=x);
 const version=1,key='chem-trivial-names-222-v1';
 let state={version,scope:'all',mode:'choice',order:[],index:0,status:{},wrong:[],roundCorrect:0,roundAnswered:0,checked:false,manual:false,input:'',review:false};
 function shuffled(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
 function valid(s){return s&&s.version===version&&Array.isArray(s.order)&&s.order.every(n=>Number.isInteger(n)&&n>=0&&n<bank.length)&&Number.isInteger(s.index)&&s.index>=0&&s.index<=s.order.length}
 function restore(saved){const s=saved?.privateContent?.trainer||saved?.trainer;if(valid(s))state={...state,...s};}
 try{const local=JSON.parse(localStorage.getItem(key)||'null');if(valid(local))state={...state,...local};}catch{}
 restore(window.openai?.widgetState);
 function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{}try{const p=window.openai?.setWidgetState?.({modelContent:{trainer:'Тривиальные названия',passed:Object.keys(state.status).length,errors:state.wrong.length,total:222},privateContent:{trainer:state}});p?.catch(()=>{});}catch{}}
 const subset=()=>bank.filter(q=>state.scope==='all'||q.type===state.scope).map(q=>q.id);
 function start(ids,review=false){state.order=shuffled(ids);state.index=0;state.roundCorrect=0;state.roundAnswered=0;state.checked=false;state.manual=false;state.input='';state.review=review;save();render();}
 function current(){return bank[state.order[state.index]];}
 function normFormula(s){const a={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9','С':'C','Н':'H','О':'O','К':'K','Р':'P','В':'B','М':'M','А':'A','Т':'T'};return s.normalize('NFKC').replace(/[₀-₉СНОКРВМАТ]/g,c=>a[c]||c).replace(/\s+/g,'').replace(/[·•*]/g,'.').replace(/,/g,'.').replace(/[–—−-]/g,'').replace(/\.+$/,'');}
 const normName=s=>s.toLowerCase().replace(/ё/g,'е').replace(/[.,;:]/g,'').replace(/\s+/g,' ').trim();
 function accepted(q,input){if(!input.trim())return false;const arr=q.accepted||[];return arr.some(a=>q.type==='name'?normFormula(input)===normFormula(a):normName(input)===normName(a));}
 function needsManual(q){return !q.accepted?.length||q.type==='contrast'||(q.type==='formula'&&/два|двух|кислоту и|вещество и/.test(q.hint||''));}
 function finishAnswer(good){const id=current().id;if(state.checked&&!state.manual)return;state.manual=false;state.checked=true;state.status[id]=good?1:2;state.roundAnswered++;if(good){state.roundCorrect++;state.wrong=state.wrong.filter(x=>x!==id)}else if(!state.wrong.includes(id))state.wrong.push(id);state.result=good?'Верно':'Нужно повторить';save();render();}
 function reveal(manual=false){state.input=el.input.value;state.checked=true;state.manual=manual;state.result=manual?'Сравни со своим ответом':'Ответ для повторения';if(!manual){state.checked=false;finishAnswer(false)}else{save();render();}}
 function gradeInput(){const q=current();state.input=el.input.value;if(!state.input.trim()){el.notice.textContent='Сначала введи ответ или нажми «Показать ответ».';el.input.focus();return;}if(needsManual(q)){reveal(true);return}if(accepted(q,state.input)){finishAnswer(true)}else{state.checked=true;state.manual=true;state.result='Сравни написание и состав';save();render();}}
 function render(){
  el.scope.value=state.scope;el.mode.value=state.mode;el.notice.textContent='';
  const done=state.index>=state.order.length;el.questionArea.hidden=done;el.finished.hidden=!done;
  const count=state.wrong.length;el.wrongCount.textContent=count;el.review.disabled=!count;el.reviewDone.disabled=!count;
  el.position.textContent=(state.review?'Повторение ошибок · ':'')+(done?state.order.length:state.index+1)+' / '+state.order.length;
  el.score.textContent='Верно: '+state.roundCorrect+' · Проверено: '+state.roundAnswered;
  const pc=state.order.length?Math.round(state.index/state.order.length*100):0;el.bar.style.width=pc+'%';el.progress.setAttribute('aria-valuenow',pc);
  if(done){el.summary.textContent='В этом круге: '+state.roundCorrect+' верных из '+state.roundAnswered+'. Осталось повторить: '+count+'.';return}
  const q=current();el.group.textContent=q.group;el.prompt.textContent=q.prompt;
  el.hint.textContent=q.hint||(q.type==='contrast'?'Укажи формулы или состав в том же порядке.':q.type==='name'?'Какая формула или какой состав соответствует названию?':'Вспомни название вещества.');
  el.options.hidden=state.mode!=='choice';el.entry.hidden=state.mode!=='write';
  el.input.value=state.input||'';el.input.disabled=state.checked;el.check.disabled=state.checked;el.reveal.disabled=state.checked;
  el.options.replaceChildren();
  // Deterministic display order survives re-rendering and restores without revealing the key.
  const opts=q.choices.map((text,i)=>({text,rank:((q.id+3)*(i+7)*97)%101})).sort((a,b)=>a.rank-b.rank);
  opts.forEach((v,i)=>{const label=document.createElement('label');label.className='form-check';const input=document.createElement('input');input.type='radio';input.name='tt-option';input.className='form-check-input';input.disabled=state.checked;input.checked=state.chosen===v.text&&state.checked;const span=document.createElement('span');span.className='form-check-label';span.textContent=v.text;input.addEventListener('change',()=>{state.chosen=v.text;finishAnswer(v.text===q.answer)});label.append(input,span);el.options.append(label)});
  el.feedback.hidden=!state.checked;el.result.textContent=state.result||'';el.correct.textContent='Правильный ответ: '+q.answer;el.self.hidden=!state.manual;
  el.next.hidden=!state.checked||state.manual;el.skip.hidden=state.checked;
  if(state.checked&&state.manual)el.notice.textContent='Равнозначная формула или формулировка тоже подходит. Оцени ответ после сравнения.';
  else if(state.mode==='write'&&needsManual(q))el.notice.textContent='Развёрнутый ответ проверяется сравнением с образцом.';
 }
 function review(){if(!state.wrong.length)return;start(state.wrong.slice(),true)}
 el.next.addEventListener('click',()=>{state.index++;state.checked=false;state.manual=false;state.input='';state.chosen=null;save();render()});
 el.check.addEventListener('click',gradeInput);el.reveal.addEventListener('click',()=>reveal(false));el.skip.addEventListener('click',()=>reveal(false));
 el.knew.addEventListener('click',()=>finishAnswer(true));el.didnt.addEventListener('click',()=>finishAnswer(false));
 el.input.addEventListener('input',()=>{state.input=el.input.value;});el.input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();gradeInput()}});
 el.scope.addEventListener('change',()=>{state.scope=el.scope.value;start(subset())});
 el.mode.addEventListener('change',()=>{state.mode=el.mode.value;save();render()});
 el.restart.addEventListener('click',()=>start(subset()));el.again.addEventListener('click',()=>start(subset()));el.review.addEventListener('click',review);el.reviewDone.addEventListener('click',review);
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render()}});
 if(!state.order.length)state.order=shuffled(subset());render();
})();
</script>
